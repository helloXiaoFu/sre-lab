# ============================================================================
# GitHub Actions Workflow - CI Pipeline
# ============================================================================
# 用途：持续集成 - 代码检查、测试、构建Docker镜像
# 触发：当代码push到main分支或创建PR时
# ============================================================================

# Workflow名称（显示在GitHub Actions页面）
name: CI Pipeline

# 触发条件（Events）
on:
  # 当push到这些分支时触发
  push:
    branches:
      - main
      - dev
    # 可选：只有特定文件变化时才触发
    paths:
      - 'app/**'
      - 'docker/**'
      - '.github/workflows/ci.yml'
  
  # 当创建或更新PR到main分支时触发
  pull_request:
    branches:
      - main
  
  # 手动触发（在GitHub UI上点击"Run workflow"）
  workflow_dispatch:

# 环境变量（全局）
env:
  PYTHON_VERSION: '3.11'
  DOCKER_IMAGE_NAME: mao-quotes-api

# Jobs（任务）
jobs:
  # 
  # Job 1: 代码质量检查
  # 
  lint:
    name: Code Linting
    runs-on: ubuntu-latest  # 运行环境
    
    steps:
      # Step 1: 检出代码
      - name: Checkout code
        uses: actions/checkout@v4  # 使用官方Action
      
      # Step 2: 设置Python环境
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'  # 缓存pip依赖
      
      # Step 3: 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort
          pip install -r app/requirements.txt
      
      # Step 4: 代码格式检查（Black）
      - name: Check code formatting
        run: black --check app/
      
      # Step 5: Import排序检查（isort）
      - name: Check import sorting
        run: isort --check-only app/
      
      # Step 6: 代码风格检查（Flake8）
      - name: Lint with flake8
        run: |
          # 停止构建如果有语法错误或未定义的名称
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # 退出但不失败（只显示警告）
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
  
  # 
  # Job 2: 单元测试
  # 
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint  # 依赖lint job，lint通过后才运行
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest pytest-cov
      
      # 运行测试（如果有tests目录）
      - name: Run tests
        run: |
          if [ -d "app/tests" ]; then
            pytest app/tests/ -v --cov=app --cov-report=xml
          else
            echo "No tests directory found, skipping tests"
          fi
      
      # 上传测试覆盖率报告（可选）
      - name: Upload coverage reports
        if: success()
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
  
  # 
  # Job 3: 构建Docker镜像
  # 
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test  # 依赖test job
    
    # 只有在main分支才构建
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 设置Docker Buildx（支持多平台构建）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # 登录到AWS ECR（需要配置Secrets）
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      # 构建Docker镜像
      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}  # 使用Git commit SHA作为tag
        run: |
          docker build \
            --platform linux/amd64 \
            -t $ECR_REGISTRY/$DOCKER_IMAGE_NAME:$IMAGE_TAG \
            -t $ECR_REGISTRY/$DOCKER_IMAGE_NAME:latest \
            -f docker/Dockerfile \
            .
      
      # 推送到ECR
      - name: Push to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$DOCKER_IMAGE_NAME:$IMAGE_TAG
          docker push $ECR_REGISTRY/$DOCKER_IMAGE_NAME:latest
      
      # 输出镜像信息
      - name: Image digest
        run: echo "Image pushed with SHA ${{ github.sha }}"

# ============================================================================
# 说明
# ============================================================================
# 
# 1. 触发条件（on）：
#    • push到main/dev分支
#    • 创建PR到main分支
#    • 手动触发（workflow_dispatch）
# 
# 2. Jobs执行顺序：
#    lint → test → build（串行）
# 
# 3. 常用Actions：
#    • actions/checkout@v4: 检出代码
#    • actions/setup-python@v5: 设置Python环境
#    • docker/setup-buildx-action@v3: 设置Docker Buildx
#    • aws-actions/configure-aws-credentials@v4: 配置AWS凭证
# 
# 4. 需要配置的Secrets（在GitHub repo settings）：
#    • AWS_ACCESS_KEY_ID
#    • AWS_SECRET_ACCESS_KEY
# 
# 5. 条件执行：
#    • if: github.ref == 'refs/heads/main'  只在main分支运行
#    • needs: lint  依赖其他job
# 
# ============================================================================
