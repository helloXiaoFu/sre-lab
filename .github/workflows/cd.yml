# ============================================================================
# 说明
# ============================================================================
# 
# 1. 触发方式：
#    • CI Pipeline成功后自动触发
#    • 手动触发（可选择环境和镜像tag）
# 
# 2. Environment配置：
#    • 在GitHub repo settings → Environments设置
#    • 可以配置审批流程（prod环境需要审批）
#    • 可以配置环境变量和Secrets
# 
# 3. 部署流程：
#    • 配置AWS和kubectl
#    • 更新Deployment镜像
#    • 等待滚动更新完成
#    • 验证部署状态
#    • 运行烟雾测试
# 
# 4. 安全最佳实践：
#    • 使用Secrets存储敏感信息
#    • 生产环境需要审批
#    • 记录部署日志
#    • 支持快速回滚
# 
# 5. 改进建议：
