# ============================================================================
# GitHub Actions Workflow - CD Pipeline
# ============================================================================
# 用途：持续部署 - 自动部署到EKS集群
# 触发：当CI Pipeline成功完成后，或手动触发
# ============================================================================

name: CD Pipeline

on:
  # 当CI workflow完成时触发
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main
  
  # 手动触发
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      image_tag:
        description: 'Docker image tag to deploy'
        required: false
        default: 'latest'

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: mao-quotes-api-dev
  ECR_REPOSITORY: mao-quotes-api
  DEPLOYMENT_NAME: mao-quotes-api

jobs:
  # 
  # Job 1: 部署到EKS
  # 
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    
    # 只有CI成功时才部署（如果是workflow_run触发）
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && 
       github.event.workflow_run.head_branch == 'main')
    
    # 环境配置（可以在GitHub UI设置审批流程）
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}
      url: http://mao-quotes-api-dev.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 配置AWS凭证
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      # 登录到ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      # 配置kubectl
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}
      
      # 验证集群连接
      - name: Verify cluster access
        run: |
          kubectl cluster-info
          kubectl get nodes
      
      # 更新Deployment镜像
      - name: Deploy to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag || 'latest' }}
        run: |
          # 方式1：使用kubectl set image（推荐，简单）
          kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} \
            api=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --record
          
          # 或者方式2：使用kubectl apply
          # kubectl apply -f k8s/deployment-eks.yaml
      
      # 等待滚动更新完成
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} \
            --timeout=5m
      
      # 验证部署
      - name: Verify deployment
        run: |
          # 检查Pod状态
          kubectl get pods -l app=mao-api
          
          # 检查Pod健康状态
          kubectl wait --for=condition=ready pod \
            -l app=mao-api \
            --timeout=2m
          
          # 获取Service信息
          kubectl get svc ${{ env.DEPLOYMENT_NAME }}-service
      
      # 运行烟雾测试（Smoke Test）
      - name: Run smoke tests
        run: |
          # 获取LoadBalancer URL
          LB_URL=$(kubectl get svc mao-quotes-service -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' || echo "")
          
          if [ -n "$LB_URL" ]; then
            echo "Testing LoadBalancer at $LB_URL"
            
            # 等待LoadBalancer就绪
            sleep 30
            
            # 测试健康检查端点
            curl -f http://$LB_URL/health || echo "Health check failed"
            curl -f http://$LB_URL/ready || echo "Ready check failed"
            
            # 测试API端点
            curl -f -X POST http://$LB_URL/chat \
              -H "Content-Type: application/json" \
              -d '{"message":"test"}' || echo "API test failed"
          else
            echo "LoadBalancer not found, skipping smoke tests"
          fi
      
      # 保存部署信息
      - name: Save deployment info
        run: |
          echo "Deployment completed at $(date)" >> deployment-log.txt
          echo "Image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> deployment-log.txt
          echo "Commit: ${{ github.sha }}" >> deployment-log.txt
          kubectl describe deployment/${{ env.DEPLOYMENT_NAME }} >> deployment-log.txt
      
      # 上传部署日志（Artifact）
      - name: Upload deployment logs
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs
          path: deployment-log.txt
          retention-days: 30
  
  # 
  # Job 2: 部署后通知（可选）
  # 
  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: deploy
    if: always()  # 无论deploy成功或失败都运行
    
    steps:
      - name: Send Slack notification
        if: success()
        run: |
          # 这里可以集成Slack/Email/钉钉等通知
          echo "✅ Deployment successful!"
          echo "Environment: ${{ github.event.inputs.environment || 'dev' }}"
          echo "Image tag: ${{ github.event.inputs.image_tag || 'latest' }}"
      
      - name: Send failure notification
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Please check the logs and rollback if necessary"

